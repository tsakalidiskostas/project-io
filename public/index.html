<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Roboto+Condensed:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="app" class="page"></main>

<nav aria-label="App" class="app-nav">
    <a href="#inbox" data-nav="inbox" aria-label="All pull requests" title="All pull requests" class="nav-cyan">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>
    </a>
    <a href="#inbox?focus=1" data-nav="analyze" aria-label="Analyze a new PR" title="Analyze a new PR" class="nav-green">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </a>
    <a href="#settings" data-nav="settings" aria-label="Settings: GitHub and Linear connections" title="Settings: GitHub and Linear connections">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </a>
</nav>

<button type="button" id="chat-launcher" class="chat-launcher" aria-label="Ask Claude to change this app" title="Ask Claude to change this app">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path></svg>
</button>

<div id="point-banner" class="point-banner" role="status" hidden>
    <span>Click any part of the app to point at it</span>
    <button type="button" id="point-cancel">Cancel</button>
</div>
<div id="point-outline" class="point-outline" hidden></div>

<aside id="chat" aria-label="Claude" class="chat" hidden>
    <div class="chat-header">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4"></path><path d="M12 17v4"></path><path d="M3 12h4"></path><path d="M17 12h4"></path><path d="m5.6 5.6 2.8 2.8"></path><path d="m15.6 15.6 2.8 2.8"></path><path d="m5.6 18.4 2.8-2.8"></path><path d="m15.6 8.4 2.8-2.8"></path></svg>
        <div class="chat-title">
            <h2>Change this app</h2>
            <span id="chat-screen" class="meta">On: Pull requests</span>
        </div>
        <button type="button" id="chat-close" class="icon-btn" aria-label="Close chat" title="Close chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
    </div>

    <ol id="change-log" class="chat-messages" aria-live="polite"></ol>

    <form id="change-form" class="composer">
        <div id="attached" class="attached" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            <span id="attached-label"></span>
            <button type="button" id="attached-remove" aria-label="Remove the pointed element" title="Remove">✕</button>
        </div>
        <label for="request" class="visually-hidden">Describe a change</label>
        <textarea id="request" rows="3" placeholder="Describe a change, or point at something first"></textarea>
        <div class="composer-actions">
            <button type="button" id="point-btn" class="btn btn-secondary point-btn" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 1v4"></path><path d="M12 19v4"></path><path d="M1 12h4"></path><path d="M19 12h4"></path></svg>
                Point at it
            </button>
            <button type="submit" id="send" class="send" aria-label="Send" title="Send">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
            </button>
        </div>
        <span class="footnote">Changes are committed to Io's repo once the typecheck and tests pass, then Io restarts. <span id="version"></span></span>
    </form>
</aside>

<script type="module" src="/app.js"></script>
</body>
</html>
